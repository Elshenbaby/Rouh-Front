{% if href %}
  <a class="btn btn-{{ variant|default:'primary' }} btn-{{ size|default:'md' }} {{ extra_class }}" href="{{ href }}">{{ label }}</a>
{% else %}
  <button type="{{ type|default:'button' }}" class="btn btn-{{ variant|default:'primary' }} btn-{{ size|default:'md' }} {{ extra_class }}">{{ label }}</button>
{% endif %}
