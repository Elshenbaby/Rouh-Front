{% load i18n %}
{% with active=active|default:"scoreboard" %}
<nav class="od-nav" aria-label="{% trans 'OD sections' %}">
  <a href="{% url 'od:dashboard' %}" class="{% if active == 'scoreboard' %}is-on{% endif %}"{% if active == 'scoreboard' %} aria-current="page"{% endif %}>{% trans "Scoreboard" %}</a>
  <a href="{% url 'od:clusters' %}" class="{% if active == 'clusters' %}is-on{% endif %}"{% if active == 'clusters' %} aria-current="page"{% endif %}>{% trans "Cluster guide" %}</a>
  {% if show_drivers and od.focus %}
  <a href="{% url 'od:lc_detail' od.focus.feed.entity_id %}" class="{% if active == 'detail' %}is-on{% endif %}"{% if active == 'detail' %} aria-current="page"{% endif %}>{% trans "LC drivers" %}</a>
  {% endif %}
</nav>
{% endwith %}
