{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <header class="page-header">
    <p class="eyebrow"><a href="{% url 'ui:desk' 'tm' %}">{% trans "Talent" %}</a>{% if entity %} · {{ entity.short_name }}{% endif %}</p>
    <h1>{{ title }}</h1>
    <p class="lede">{{ lede }}</p>
  </header>
  {% include "tm/partials/tabs.html" %}
  <form method="get" aria-label="{% trans 'Filter performance' %}" class="filter-bar is-wide desk-filters">
    <label class="field">
      <span>{% trans "Function" %}</span>
      <select name="function">
        {% for value, label in functions %}
          <option value="{{ value }}"{% if function == value %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span>{% trans "Month" %}</span>
      <input type="month" name="month" value="{{ month_param }}">
    </label>
    <button class="btn" type="submit">{% trans "Show" %}</button>
  </form>
  {% include "tm/partials/performance_table.html" %}
{% endblock %}
