{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <header class="page-header">
    <p class="eyebrow"><a href="{% url 'tm:structure' %}">{% trans "Structure" %}</a></p>
    <h1>{{ title }}</h1>
    <p class="lede">{{ lede }}</p>
  </header>
  {% include "tm/partials/tabs.html" %}
  <form method="post" class="work-form">
    {% csrf_token %}
    {% for field in form %}
      <label class="field">
        <span>{{ field.label }}</span>
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">{% trans "Reverse exit" %}</button>
      <a class="btn" href="{% url 'tm:structure' %}">{% trans "Cancel" %}</a>
    </div>
  </form>
{% endblock %}
